<div class="relative w-full max-w-md">

  <!-- Search Icon -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="19"
    height="19"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="
      absolute
      left-4
      top-1/2
      -translate-y-1/2
      text-body
      pointer-events-none
    "
  >
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.3-4.3"></path>
  </svg>

  <!-- Input -->
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (keyup.enter)="search()"
    placeholder="Search books, authors..."
    class="
      w-full
      bg-background
      border
      border-border
      rounded-full
      pl-11
      pr-11
      py-2.5
      text-sm
      text-heading
      placeholder:text-body
      outline-none

      focus:border-secondary
      focus:ring-2
      focus:ring-secondary/10

      transition-all
      duration-200
    "
  />

  <!-- Clear -->
  <button
    *ngIf="searchTerm"
    type="button"
    (click)="clearSearch()"
    class="
      absolute
      right-4
      top-1/2
      -translate-y-1/2
      text-body
      hover:text-danger
      transition
    "
  >
    ×
  </button>

</div>
