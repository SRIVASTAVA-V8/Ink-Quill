<nav
  class="
    bg-surface
    border-b border-border
    shadow-sm
    sticky top-0 z-50
  "
>
  <div class="container mx-auto px-6">
    
    <div class="flex items-center h-20">

      <!-- ==================== LOGO ==================== -->
      <a
        routerLink="/"
        class="
          flex-shrink-0
          text-2xl
          font-bold
          bg-gradient-to-r
          from-secondary
          to-primary
          bg-clip-text
          text-transparent
        "
      >
        Ink&Quill
      </a>


      <!-- ==================== LEFT NAVIGATION ==================== -->
      <div
        class="
          hidden
          md:flex
          items-center
          gap-8
          ml-12
        "
      >

        <!-- Home -->
        <a
          routerLink="/"
          routerLinkActive="active-nav"
          [routerLinkActiveOptions]="{ exact: true }"
          class="
            relative
            py-2
            text-body
            font-semibold
            hover:text-primary
            transition-colors
            duration-200

            after:content-['']
            after:absolute
            after:left-0
            after:-bottom-1
            after:h-0.5
            after:w-0
            after:bg-secondary
            after:rounded-full
            after:transition-all
            after:duration-300

            hover:after:w-full
          "
        >
          Home
        </a>


        <!-- Books -->
        <a
          routerLink="/books"
          routerLinkActive="active-nav"
          class="
            relative
            py-2
            text-body
            font-semibold
            hover:text-primary
            transition-colors
            duration-200

            after:content-['']
            after:absolute
            after:left-0
            after:-bottom-1
            after:h-0.5
            after:w-0
            after:bg-secondary
            after:rounded-full
            after:transition-all
            after:duration-300

            hover:after:w-full
          "
        >
          Books
        </a>

      </div>


     <div class="hidden md:flex flex-1 justify-center px-10">
  <app-search></app-search>
</div>


      <!-- ==================== RIGHT SECTION ==================== -->
      <div
        class="
          flex
          items-center
          gap-5
          ml-auto
        "
      >

        <!-- Wishlist -->
        <button
          type="button"
          routerLink="/wishlist"
          routerLinkActive="text-primary"
          class="
            group
            relative
            text-body
            hover:text-primary
            transition-all
            duration-200
            hover:-translate-y-1
          "
          title="Wishlist"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
            ></path>
          </svg>

          <!-- Hover underline -->
          <span
            class="
              absolute
              -bottom-2
              left-1/2
              -translate-x-1/2
              w-0
              h-0.5
              bg-secondary
              rounded-full
              group-hover:w-4
              transition-all
              duration-200
            "
          ></span>

        </button>


        <!-- Cart -->
        <button
          type="button"
          routerLink="/cart"
          routerLinkActive="text-primary"
          class="
            group
            relative
            text-body
            hover:text-primary
            transition-all
            duration-200
            hover:-translate-y-1
          "
          title="Cart"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="21" r="1"></circle>
            <circle cx="19" cy="21" r="1"></circle>
            <path
              d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"
            ></path>
          </svg>

          <!-- Cart Count -->
          <span
            class="
              absolute
              -top-2
              -right-3
              bg-danger
              text-white
              text-[10px]
              font-bold
              rounded-full
              w-5
              h-5
              flex
              items-center
              justify-center
            "
          >
            {{ cartCount }}
          </span>

          <!-- Hover underline -->
          <span
            class="
              absolute
              -bottom-2
              left-1/2
              -translate-x-1/2
              w-0
              h-0.5
              bg-secondary
              rounded-full
              group-hover:w-4
              transition-all
              duration-200
            "
          ></span>

        </button>


        <!-- ==================== LOGGED OUT ==================== -->

        <div
          *ngIf="!(isLoggedIn$ | async); else userMenu"
          class="
            flex
            items-center
            gap-4
          "
        >

          <!-- Login -->
          <button
            type="button"
            routerLink="/auth/login"
            class="
              text-body
              font-semibold
              hover:text-primary
              transition-colors
              duration-200
            "
          >
            Login
          </button>


          <!-- Sign Up -->
          <button
            type="button"
            routerLink="/auth/register"
            class="
              bg-primary
              text-white
              px-4
              py-2
              rounded-lg
              font-semibold

              shadow-sm

              hover:bg-secondary
              hover:-translate-y-0.5
              hover:shadow-md

              transition-all
              duration-200
            "
          >
            Sign Up
          </button>

        </div>


        <!-- ==================== LOGGED IN ==================== -->

        <ng-template #userMenu>

          <div
            class="relative"
            appClickOutside
            (clickOutside)="closeUserMenu()"
          >

            <!-- User Button -->
            <button
              type="button"
              (click)="toggleUserMenu()"
              class="
                group
                flex
                items-center
                gap-2
                text-primary
                font-medium
                hover:-translate-y-0.5
                transition-all
                duration-200
              "
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
                ></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>

              <span>
                {{ (currentUser$ | async)?.name }}
              </span>

            </button>


            <!-- Dropdown -->
            <div
              *ngIf="userMenuOpen"
              class="
                absolute
                right-0
                mt-3
                w-52
                bg-surface
                border
                border-border
                rounded-xl
                shadow-xl
                py-2
                z-50
              "
            >

              <a
                routerLink="/profile"
                class="
                  block
                  px-4
                  py-2.5
                  text-body
                  hover:bg-background
                  hover:text-primary
                  transition-colors
                "
              >
                Profile
              </a>

              <a
                routerLink="/orders"
                class="
                  block
                  px-4
                  py-2.5
                  text-body
                  hover:bg-background
                  hover:text-primary
                  transition-colors
                "
              >
                My Orders
              </a>

              <a
                *ngIf="isAdmin"
                routerLink="/admin"
                class="
                  block
                  px-4
                  py-2.5
                  text-body
                  hover:bg-background
                  hover:text-primary
                  transition-colors
                "
              >
                Admin Panel
              </a>

              <button
                type="button"
                (click)="logout()"
                class="
                  block
                  w-full
                  text-left
                  px-4
                  py-2.5
                  text-body
                  hover:bg-background
                  hover:text-danger
                  transition-colors
                "
              >
                Logout
              </button>

            </div>

          </div>

        </ng-template>

      </div>

    </div>
  </div>
</nav>
