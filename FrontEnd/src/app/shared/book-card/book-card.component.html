<div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 group cursor-pointer"
         [routerLink]="['/books', book._id]">
      <!-- Image Container -->
      <div class="relative overflow-hidden">
        <img [src]="book.image[0]" [alt]="book.title" 
             class="w-full h-64 object-cover transform group-hover:scale-110 transition-transform duration-500">
        
        <!-- Badges -->
        <div class="absolute top-3 right-3 bg-yellow-400 text-gray-900 px-2 py-1 rounded-lg text-xs font-bold">
          ★ {{ book.ratingAvg }}
        </div>
        
        <div *ngIf="book.discount > 0" class="absolute top-3 left-3 bg-red-500 text-white px-2 py-1 rounded-lg text-xs font-bold">
          -{{ book.discount }}%
        </div>
        
        <div *ngIf="book.stock === 0" class="absolute inset-0 bg-black/60 flex items-center justify-center">
          <span class="text-white font-bold text-lg">Out of Stock</span>
        </div>

        <!-- Quick Actions (on hover) -->
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-3">
          <button (click)="addToCart($event)" 
                  [disabled]="book.stock === 0"
                  class="bg-white text-gray-900 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-600 hover:text-white transition disabled:opacity-50">
            Quick Add
          </button>
          <button (click)="toggleWishlist($event)" 
                  class="bg-white text-gray-900 px-4 py-2 rounded-lg font-semibold hover:bg-pink-600 hover:text-white transition">
            {{ isInWishlist ? '❤️' : '🤍' }}
          </button>
        </div>
      </div>
      
      <!-- Content -->
      <div class="p-4">
        <h3 class="font-bold text-lg mb-1 group-hover:text-indigo-600 transition line-clamp-1">
          {{ book.title }}
        </h3>
        <p class="text-gray-600 dark:text-gray-400 text-sm mb-2">{{ book.author }}</p>
        
        <div class="flex items-center gap-2 mb-3">
          <span class="text-yellow-500">★</span>
          <span class="text-sm">{{ book.ratingAvg }}</span>
          <span class="text-gray-400 text-sm">({{ book.ratingCount }})</span>
          <span *ngIf="book.stock > 0" class="ml-auto text-green-600 text-xs">In Stock</span>
          <span *ngIf="book.stock === 0" class="ml-auto text-red-600 text-xs">Out of Stock</span>
        </div>
        
        <div class="flex justify-between items-center">
          <div>
            <span class="text-xl font-bold text-indigo-600">\${{ getDiscountedPrice() }}</span>
            <span *ngIf="book.discount > 0" class="ml-2 text-sm text-gray-500 line-through">\${{ book.price }}</span>
          </div>
          <button (click)="addToCart($event)" 
                  [disabled]="book.stock === 0"
                  class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-indigo-700 transition disabled:opacity-50">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
