<section class="space-y-6">
  <div class="rounded-2xl border border-border bg-surface p-6 shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-secondary">Catalog</p>
        <h2 class="mt-2 text-2xl font-bold text-heading">Inventory Management</h2>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <input
          type="number"
          [(ngModel)]="threshold"
          min="0"
          class="w-24 rounded border border-border bg-background px-3 py-2 text-sm text-body outline-none ring-0"
        />
        <button
          type="button"
          (click)="loadLowStockAlerts()"
          class="rounded bg-primary px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#1B2639]"
        >
          Low Stock
        </button>
        <button
          type="button"
          (click)="loadInventory()"
          class="rounded border border-border px-4 py-2 text-sm font-semibold text-body transition hover:border-primary hover:text-primary"
        >
          All Books
        </button>
        <button
          type="button"
          (click)="openCreateForm()"
          class="rounded bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700"
        >
          + Add Book
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isFormOpen" class="rounded-2xl border border-border bg-surface p-6 shadow-sm">
    <div class="mb-5 flex items-center justify-between">
      <h3 class="text-xl font-bold text-heading">{{ isEditing ? 'Edit Book' : 'Add New Book' }}</h3>
      <button type="button" (click)="resetForm()" class="text-sm font-medium text-muted">Close</button>
    </div>

    <form (ngSubmit)="submitBookForm()" class="grid gap-4 md:grid-cols-2">
      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Title
        <input [(ngModel)]="bookForm.title" name="title" type="text" class="rounded border border-border bg-background px-3 py-2 text-body" required />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Author
        <input [(ngModel)]="bookForm.author" name="author" type="text" class="rounded border border-border bg-background px-3 py-2 text-body" required />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Price
        <input [(ngModel)]="bookForm.price" name="price" type="number" min="0" step="0.01" class="rounded border border-border bg-background px-3 py-2 text-body" required />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Stock
        <input [(ngModel)]="bookForm.stock" name="stock" type="number" min="0" class="rounded border border-border bg-background px-3 py-2 text-body" required />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Category
        <select [(ngModel)]="bookForm.category" name="category" class="rounded border border-border bg-background px-3 py-2 text-body">
          <option>Fiction</option>
          <option>Non-Fiction</option>
          <option>Sci-Fi</option>
          <option>Biography</option>
          <option>Romance</option>
          <option>Mystery</option>
          <option>Fantasy</option>
        </select>
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Language
        <input [(ngModel)]="bookForm.language" name="language" type="text" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body md:col-span-2">
        Description
        <textarea [(ngModel)]="bookForm.description" name="description" rows="3" class="rounded border border-border bg-background px-3 py-2 text-body"></textarea>
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        ISBN
        <input [(ngModel)]="bookForm.ISBN" name="ISBN" type="text" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Discount (%)
        <input [(ngModel)]="bookForm.discount" name="discount" type="number" min="0" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Publisher
        <input [(ngModel)]="bookForm.publisher" name="publisher" type="text" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body">
        Published Date
        <input [(ngModel)]="bookForm.publishedDate" name="publishedDate" type="date" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-body md:col-span-2">
        Tags
        <input [(ngModel)]="bookForm.tags" name="tags" type="text" placeholder="fiction, bestseller, award-winning" class="rounded border border-border bg-background px-3 py-2 text-body" />
      </label>

      <div class="md:col-span-2 flex justify-end gap-3 pt-2">
        <button type="button" (click)="resetForm()" class="rounded border border-border px-4 py-2 text-sm font-semibold text-body">Cancel</button>
        <button type="submit" class="rounded bg-primary px-5 py-2 text-sm font-semibold text-white">{{ isEditing ? 'Save Changes' : 'Create Book' }}</button>
      </div>
    </form>
  </div>

  <div class="rounded-2xl border border-border bg-surface p-4 shadow-sm">
    <input
      [(ngModel)]="searchTerm"
      type="text"
      placeholder="Search by title, author, or category"
      class="w-full rounded border border-border bg-background px-3 py-2 text-body outline-none"
    />
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <div class="h-10 w-10 animate-spin rounded-full border-b-2 border-primary"></div>
  </div>

  <div *ngIf="!loading && error" class="rounded-xl border border-red-200 bg-red-50 p-4 text-red-700">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="overflow-hidden rounded-2xl border border-border bg-surface shadow-sm">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-border text-left">
        <thead class="bg-background">
          <tr>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Title</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Author</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Category</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Price</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Stock</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border">
          <tr *ngFor="let book of getVisibleBooks()">
            <td class="px-4 py-3 font-medium text-heading">{{ book.title }}</td>
            <td class="px-4 py-3 text-body">{{ book.author }}</td>
            <td class="px-4 py-3 text-body">{{ book.category }}</td>
            <td class="px-4 py-3 text-body">{{ formatCurrency(book.price) }}</td>
            <td class="px-4 py-3">
              <span
                [ngClass]="book.stock > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'"
                class="rounded-full px-2.5 py-1 text-xs font-semibold"
              >
                {{ book.stock }}
              </span>
            </td>
            <td class="px-4 py-3">
              <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                  <select [(ngModel)]="stockOperation" class="rounded border border-border bg-background px-2 py-1.5 text-xs">
                    <option value="add">Add</option>
                    <option value="subtract">Subtract</option>
                    <option value="set">Set</option>
                  </select>
                  <input [(ngModel)]="stockAdjustValue" type="number" min="0" class="w-20 rounded border border-border bg-background px-2 py-1.5 text-xs" />
                  <button type="button" (click)="updateStock(book)" class="rounded bg-slate-800 px-2 py-1.5 text-xs font-semibold text-white">Apply</button>
                </div>
                <div class="flex gap-2">
                  <button type="button" (click)="openEditForm(book)" class="rounded border border-border px-2 py-1.5 text-xs font-semibold text-body">Edit</button>
                  <button type="button" (click)="deleteBook(book)" class="rounded border border-red-200 px-2 py-1.5 text-xs font-semibold text-red-600">Delete</button>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
