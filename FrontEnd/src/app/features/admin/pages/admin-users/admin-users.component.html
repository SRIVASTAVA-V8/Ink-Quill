<section class="space-y-6">
  <div class="rounded-2xl border border-border bg-surface p-6 shadow-sm">
    <div class="flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-secondary">Accounts</p>
        <h2 class="mt-2 text-2xl font-bold text-heading">User Management</h2>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <div class="h-10 w-10 animate-spin rounded-full border-b-2 border-primary"></div>
  </div>

  <div *ngIf="!loading && error" class="rounded-xl border border-red-200 bg-red-50 p-4 text-red-700">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="overflow-hidden rounded-2xl border border-border bg-surface shadow-sm">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-border text-left">
        <thead class="bg-background">
          <tr>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Name</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Email</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Role</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Status</th>
            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-[0.16em] text-muted">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border">
          <tr *ngFor="let user of users">
            <td class="px-4 py-3 font-medium text-heading">{{ user.name }}</td>
            <td class="px-4 py-3 text-body">{{ user.email }}</td>
            <td class="px-4 py-3">
              <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold uppercase text-heading">
                {{ user.role }}
              </span>
            </td>
            <td class="px-4 py-3">
              <span
                [ngClass]="user.isActive ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'"
                class="rounded-full px-2.5 py-1 text-xs font-semibold"
              >
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-4 py-3">
              <div class="flex flex-wrap gap-2">
                <button
                  type="button"
                  (click)="changeRole(user)"
                  class="rounded border border-border px-3 py-1.5 text-xs font-semibold text-body transition hover:border-primary hover:text-primary"
                >
                  Make {{ user.role === 'admin' ? 'User' : 'Admin' }}
                </button>
                <button
                  type="button"
                  (click)="toggleUserStatus(user)"
                  class="rounded border border-border px-3 py-1.5 text-xs font-semibold text-body transition hover:border-primary hover:text-primary"
                >
                  {{ user.isActive ? 'Disable' : 'Enable' }}
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
