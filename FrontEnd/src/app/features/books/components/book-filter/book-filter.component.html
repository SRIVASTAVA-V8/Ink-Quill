<div
  class="
    bg-surface
    rounded-2xl
    border
    border-border
    shadow-sm
    p-6
    sticky
    top-24
  "
>

  <div class="flex items-center justify-between mb-6">

    <h3 class="text-xl font-bold text-heading">
      Filters
    </h3>

    <button
      type="button"
      (click)="clearFilters()"
      class="
        text-xs
        font-medium
        text-body
        hover:text-primary
        transition-colors
      "
    >
      Clear all
    </button>

  </div>

  <div class="mb-7">

    <h4
      class="
        font-semibold
        text-heading
        mb-3
      "
    >
      Category
    </h4>


    <div class="space-y-2.5">

      <label
        *ngFor="let cat of categories"
        class="
          flex
          items-center
          cursor-pointer
          group
        "
      >

        <input
          type="radio"
          name="category"
          [value]="cat"
          [checked]="
            selectedCategory === cat
          "
          (change)="onCategoryChange(cat)"
          class="
            mr-3
            accent-secondary
          "
        >


        <span
          class="
            text-sm
            text-body
            group-hover:text-primary
            transition-colors
          "
        >
          {{ cat }}
        </span>

      </label>

    </div>

  </div>


  <div class="mb-7">

    <div class="flex justify-between items-center mb-3">

      <h4
        class="
          font-semibold
          text-heading
        "
      >
        Price Range
      </h4>


      <span
        *ngIf="maxPrice !== null"
        class="
          text-sm
          font-semibold
          text-primary
        "
      >
        ₹{{ maxPrice }}
      </span>


      <span
        *ngIf="maxPrice === null"
        class="
          text-xs
          font-medium
          text-body
        "
      >
        Any price
      </span>

    </div>


    <input
      type="range"
      min="0"
      max="2000"
      step="50"
      [value]="maxPrice ?? 2000"
      (input)="maxPrice = +$any($event.target).value"
      (change)="onPriceChange()"
      class="
        w-full
        accent-secondary
        cursor-pointer
      "
    >


    <div
      class="
        flex
        justify-between
        text-xs
        text-body
        mt-2
      "
    >

      <span>
        ₹0
      </span>

      <span>
        ₹2000+
      </span>

    </div>


    <!-- No price restriction -->

    <label
      class="
        flex
        items-center
        gap-2
        mt-4
        cursor-pointer
      "
    >

      <input
        type="checkbox"
        [checked]="maxPrice === null"
        (change)="
          maxPrice =
            $any($event.target).checked
              ? null
              : 2000;
          onPriceChange()
        "
        class="accent-secondary"
      >

      <span class="text-sm text-body">
        No maximum price
      </span>

    </label>

  </div>

  <div class="mb-7">

    <h4
      class="
        font-semibold
        text-heading
        mb-3
      "
    >
      Minimum Rating
    </h4>


    <div class="space-y-2.5">

      <label
        *ngFor="let rating of [4, 3, 2, 1]"
        class="
          flex
          items-center
          cursor-pointer
          group
        "
      >

        <input
          type="radio"
          name="rating"
          [value]="rating"
          [checked]="
            selectedRating === rating
          "
          (change)="onRatingChange(rating)"
          class="
            mr-3
            accent-secondary
          "
        >


        <span
          class="
            text-sm
            text-body
            group-hover:text-primary
            transition-colors
          "
        >
          {{ rating }} ★ & up
        </span>

      </label>

    </div>

  </div>


  <!-- ============================= -->
  <!-- CLEAR BUTTON -->
  <!-- ============================= -->

  <button
    type="button"
    (click)="clearFilters()"
    class="
      w-full
      border
      border-border
      text-primary
      font-semibold
      py-2.5
      rounded-lg

      hover:bg-background
      hover:border-secondary

      transition-all
      duration-200
    "
  >
    Clear All Filters
  </button>

</div>
