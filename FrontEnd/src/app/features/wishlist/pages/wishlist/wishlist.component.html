<div class="container mx-auto px-6 py-12">
  <!-- Page Header -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-4xl font-bold text-heading text-primary ">
  My Wishlist
</h1>
      <p class="text-body dark:text-gray-400 mt-2">
        {{ wishlist?.items?.length || 0 }} books saved for later
      </p>
    </div>
    <button *ngIf="wishlist && wishlist.items && wishlist.items.length > 0" 
            (click)="clearWishlist()" 
            class="text-red-500 hover:text-red-700 transition">
      Clear All
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-20">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
  </div>

  <!-- Empty Wishlist -->
   <div *ngIf="!loading && (!wishlist || !wishlist.items || wishlist.items.length === 0)" 
       class="text-center py-20 bg-surface dark:bg-gray-800 rounded-xl shadow-lg">
    <div class="text-6xl mb-4">💔</div>
    <h3 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-2">Your wishlist is empty</h3>
    <p class="text-gray-500 mb-6">Start adding your favorite books to your wishlist</p>
    <button routerLink="/books" class="btn-primary">Browse Books</button>
  </div>

  <!-- Wishlist Grid -->
  <div
    *ngIf="!loading && wishlist && wishlist.items && wishlist.items.length > 0"
     class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <app-book-card
       *ngFor="let item of wishlist.items"
       [book]="item.book!"
       [wishlistMode]="true"
       [addedAt]="item.addedAt"
      (removeWishlist)="removeFromWishlist(item.bookId, $event)">
    </app-book-card>
  </div>
 </div>
