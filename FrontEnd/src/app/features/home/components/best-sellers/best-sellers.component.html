<section class="py-20 bg-background">
      <div class="container mx-auto px-6">
        <div class="text-center mb-12">
          <h2 class="text-4xl font-bold text-primary mb-4">
            🏆 Bestsellers
          </h2>
          <p class="text-body dark:text-gray-400 text-lg max-w-2xl mx-auto">
            Most popular books loved by our community
          </p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
          <app-book-card *ngFor="let book of bestsellers" [book]="book"></app-book-card>
        </div>
      </div>
    </section>
