<section class="py-20 bg-gray-50 dark:bg-gray-800">
      <div class="container mx-auto px-6">
        <h2 class="text-4xl font-bold text-center mb-12 bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          Shop by Category
        </h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-4">
          <div *ngFor="let category of categories" 
               (click)="navigateToCategory(category.name)"
               class="group cursor-pointer text-center p-6 rounded-2xl bg-white dark:bg-gray-700 shadow-md hover:shadow-xl transition-all transform hover:-translate-y-2">
            <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">{{ category.icon }}</div>
            <h3 class="font-semibold text-gray-900 dark:text-white">{{ category.name }}</h3>
            <p class="text-sm text-gray-500 mt-1">{{ category.count }}+ books</p>
          </div>
        </div>
      </div>
    </section>
