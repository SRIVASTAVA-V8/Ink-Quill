<section class="bg-background py-20">
  <div class="container mx-auto px-6">

    <!-- Section Header -->
    <div class="text-center mb-12">

      <span
        class="
          inline-block
          mb-3
          text-sm
          font-semibold
          tracking-widest
          uppercase
          text-secondary
        "
      >
        Handpicked for you
      </span>

      <h2
        class="
          text-3xl
          md:text-4xl
          font-bold
          text-heading
          mb-4
        "
      >
        New Arrivals
      </h2>

      <p
        class="
          max-w-2xl
          mx-auto
          text-body
          text-base
          md:text-lg
        "
      >
        Discover stories worth getting lost in, carefully selected
        from our collection.
      </p>

    </div>


    <!-- Books -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <app-book-card *ngFor="let book of newarrivals" [book]="book"></app-book-card>

    </div>

  </div>
</section>
